name: Publish to PyPI

# Runs when a GitHub Release is published (e.g. tag v0.1.0) and uploads to PyPI.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Run tests before publishing
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Run examples
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: Check the release tag matches __version__
        run: |
          VERSION=$(python -c "import odiatranslit; print(odiatranslit.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "Package version: $VERSION, release tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match __version__ $VERSION"
            exit 1
          fi

      - name: Check CHANGELOG has an entry for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section"
            exit 1
          fi

      - name: Build wheel and source archive
        run: |
          rm -rf dist
          python -m build

      - name: Check the package metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odiatranslit
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
