line-length = 88
target-version = "py310"
# extend-exclude = ["node_modules", "migrations"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    # "PT",   # flake8-pytest-style
    # "T20",  # flake8-print
    # "D",    # pydocstyle (enable later)
]
ignore = [
    "E501",  # line length (handled by formatter)
    "W191",  # tab indentation (conflicts with formatter)
    "E111",  # indentation not multiple of four (conflicts with formatter)
    "E114",  # conflicts with formatter
    "E117",  # conflicts with formatter
]
fixable = ["ALL"]

[lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[lint.isort]
known-first-party = ["odiatranslit"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
