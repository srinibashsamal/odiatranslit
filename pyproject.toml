[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "odia-transliterate"
dynamic = ["version"]
description = "Odia <-> Roman transliteration (ISO 15919, Hunterian, ITRANS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Srinibash Samal" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["odia", "oriya", "transliteration", "iso15919", "itrans", "indic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.10", "build"]

[project.urls]
Homepage = "https://github.com/srinibashsamal/odia-transliterate"
Issues = "https://github.com/srinibashsamal/odia-transliterate/issues"

[project.scripts]
odia-transliterate = "odia_transliterate.cli:main"

[tool.setuptools]
packages = ["odia_transliterate"]

[tool.setuptools.dynamic]
version = { attr = "odia_transliterate.__version__" }

[tool.setuptools.package-data]
odia_transliterate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "odia_transliterate"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: long doctest output lines are fine; the formatter handles code.
# UP0xx: keep typing.List / Optional etc. while 3.9 is supported.
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["odia_transliterate"]
